[package]
name = "edital-killer"
version = "0.1.0"
description = "Edital Killer"
authors = ["vbo"]
edition = "2021"
default-run = "edital-killer"

[lib]
# The `_lib` suffix avoids a name clash between lib and bin on Windows (cargo#8519).
name = "edital_killer_lib"
# No cdylib: on windows-gnu the DLL would exceed the 65535-export limit, and it is only needed for Android.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
tokio = { version = "1", features = ["process", "time", "macros", "rt", "sync", "io-util"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
ts-rs = "11"
unicode-normalization = "0.1"
which = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
async-trait = "0.1"
jsonschema = { version = "0.58.6", default-features = false }
regex = "1.13.1"

[dev-dependencies]
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2.190"
